# ffinance.uz — семейный учёт финансов
# Прокси только на 127.0.0.1:3010 (контейнер ffinance-web).
# Не использовать default_server — не перехватывать чужие домены.

server {
    listen 80;
    listen [::]:80;
    server_name ffinance.uz www.ffinance.uz;

    access_log /var/log/nginx/ffinance.access.log;
    error_log  /var/log/nginx/ffinance.error.log;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
