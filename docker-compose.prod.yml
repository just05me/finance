name: ffinance

services:
  db:
    image: postgres:16-alpine
    container_name: ffinance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ffinance-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ffinance-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/finance
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
