name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/finance-app
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Update ECS task definition and trigger deployment
        env:
          CLUSTER: finance
          SERVICE: web
          FAMILY: finance-web
          IMAGE: ${{ steps.ecr.outputs.registry }}/finance-app:${{ github.sha }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --output json)
          NEW_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE" '
            .taskDefinition |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
            .containerDefinitions[0].image = $IMAGE
          ')
          echo "$NEW_DEF" > td.json
          REV=$(aws ecs register-task-definition --cli-input-json file://td.json --query "taskDefinition.taskDefinitionArn" --output text)
          echo "New revision: $REV"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$REV" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
